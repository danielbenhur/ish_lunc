  - name: ire_cs_ind_eco
    path: "/home/luca_profissional/Desktop/BolsaLabgest/ish_lunc/functions_module_ish_eco/input/Indicador Industria - Bernardo - Ind_sc_otto.csv"
    indicadores:
      - name: ihu_nu_indriscoinerente
      - name: ihu_nu_indriscoposdeficit
      - name: ihu_nu_indriscototal
      - name: ihu_cs_ish_ind
      - name: deman_indus
        depends_on: ['Valor que eu quero ', '/home/luca_profissional/Desktop/BolsaLabgest/ish_lunc/functions_module_ish_eco/input/Indicador Industria - Bernardo - demanda.csv']
        pesos: [1]
      - name: densidade_ind
      - name: dem_ind_scbc
      - name: dem_ind_bacia
      - name: perc_scbc_ind
      - name: ihu_rel_ind
      - name: ire_cs_ind_eco

result:
  - name: ire_cs_eco
    depends_on:
      - name: ire_cs_ind_eco
        peso: 1
      - name: ire_cs_irri_eco
        peso: 0.7
      - name: ire_cs_pec_eco
