# scenario_test.yaml -exemplo mínimo
# O ideal é que esse arquivo esteja dentro da pasta do cenário, ao lado das subpastas input e output
id: economico
description: "Calculando a dimensão econômica"
base_dir: "."

bho:
  path: "/home/luca_profissional/Desktop/BolsaLabgest/ish_lunc/cnr_A/input/BHO_area.gpkg"

dimensions:
  - name: PAM_analises_iniciais
    path: "./PAM - ES - Producao irrigada .csv"
    indicadores:
      - name: irri_arroz
      - name: irri_cafe
      - name: irri_cana
      - name: irri_oc
    output: "./irri_arroz.csv"
  
  - name: ire_cs_irri_eco
    path: "./irri_arroz.csv"
    indicadores:
      - name: irri_total
      - name: irri_arroz_risco_iminente
      - name: irri_arroz_risco_pos_deficit
      - name: irri_arroz_risco_total
      - name: irri_cafe_risco_iminente
      - name: irri_cafe_risco_pos_deficit
      - name: irri_cafe_risco_total
      - name: irri_cana_risco_iminente
      - name: irri_cana_risco_pos_deficit
      - name: irri_cana_risco_total
      - name: irri_oc_risco_iminente
      - name: irri_oc_risco_pos_deficit
      - name: irri_oc_risco_total
      - name: irri_total_risco_iminente
      - name: irri_total_risco_pos_deficit
      - name: irri_total_risco_total
      - name: cs_ish_irri
      - name: deman_irri
      - name: densidade_irri
      - name: deman_agri_scbc
      - name: deman_agri_otto
      - name: perc_scbc
      - name: irri_risco_scbc
      - name: cs_ish_scbc
      - name: irri_scbc
      - name: ire_cs_irri_eco
  - name: ire_cs_pec_eco
    path: "./PPM - ES - Pec_otto.csv"
    indicadores:
      - name: pec_bov
      - name: pec_bub
      - name: pec_sui
      - name: pec_cap
      - name: pec_ovi
      - name: pec_gal
      - name: pec_total
      - name: pec_risco_iminente
      - name: pec_risco_pos_deficit
      - name: pec_risco_total
      - name: cs_ish_pec
      - name: deman_pecuaria
      - name: densidade
      - name: deman_pecuaria_scbc
      - name: deman_pecuaria_otto
      - name: perc_deman_pecuaria
      - name: ire_cs_pec_eco
      
  - name: ire_cs_ind_eco
    path: "./Indicador Industria - Bernardo - Ind_sc_otto.csv"
    indicadores:
      - name: ihu_cs_ish_ind
      - name: deman_indus
      - name: densidade_ind
      - name: perc_scbc_ind
      - name: ihu_rel

result:
  - name: ire_cs_eco
    depends_on:
      - name: ire_cs_ind_eco
        peso: 1
      - name: ire_cs_irri_eco
        peso: 0.7
      - name: ire_cs_pec_eco
        peso: 0.3

# Saída: pode opcionalmente sobrescrever pasta output/gpkg final
output:
  path: "./output/ish_eco.csv"

# logging / metadados (opcional)
metadata:
  manifest: "./output/my_new_dimensions_cenario_manifest.json"
 