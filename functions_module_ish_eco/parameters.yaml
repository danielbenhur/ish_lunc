# scenario_test.yaml -exemplo mínimo
# O ideal é que esse arquivo esteja dentro da pasta do cenário, ao lado das subpastas input e output
id: economico
description: "Calculando a dimensão econômica"
base_dir: "."

# aqui fica o DataFrame geral, que congrega todos os dados usados
intermediario: "/home/luca_profissional/Desktop/BolsaLabgest/ish_lunc/dados_gerais/arquivo_intermediario.csv"

dimensions:
  - name: ire_cs_irri_eco
    path: "/home/luca_profissional/Desktop/BolsaLabgest/ish_lunc/functions_module_ish_eco/input/PAM - ES - Producao irrigada .csv"
    indicadores:
      - name: irri_arroz
        depends_on: ['area_arroz', 'taxa_arroz']
        pesos: [1,1] 
      - name: irri_cafe
        depends_on: ['Area potencial de ser colhida irrigada por municipio por cultura  (Café)', 'Taxa regional media de produção de Café (1000R$/ha) ']
        pesos: [1,1] 
      - name: irri_cana
        depends_on: ['Area potencial de ser colhida irrigada por municipio por cultura (Cana)', 'Taxa regional media de produção de Cana (1000R$/ha) ']
        pesos: [1,1] 
      - name: irri_oc
        depends_on: ['Area potencial de ser colhida irrigada por municipio por cultura (Outras Culturas)', 'Taxa regional media de produção de Demais culturas (1000R$/ha) ']
        pesos: [1,1] 
      - name: irri_total
        depends_on: ['irri_arroz', 'irri_cafe', 'irri_cana', 'irri_oc']
        pesos: [1,1,1,1] 
      - name: irri_arroz_risco_iminente
        depends_on: ['irri_arroz', 'fator_iminente']
        pesos: [1,1] 
      - name: irri_arroz_risco_pos_deficit
        depends_on: ['irri_arroz', 'fator_pos_deficit']
        pesos: [1,1] 
      - name: irri_arroz_risco_total
        depends_on: ['irri_arroz', 'fator_de_risco_total']
        pesos: [1,1] 
      - name: irri_cafe_risco_iminente
        depends_on: ['irri_cafe', 'fator_iminente']
        pesos: [1,1] 
      - name: irri_cafe_risco_pos_deficit
        depends_on: ['irri_cafe', 'fator_pos_deficit']
        pesos: [1,1] 
      - name: irri_cafe_risco_total
        depends_on: ['irri_cafe', 'fator_de_risco_total']
        pesos: [1,1] 
      - name: irri_cana_risco_iminente
        depends_on: ['irri_cana', 'fator_iminente']
        pesos: [1,1] 
      - name: irri_cana_risco_pos_deficit
        depends_on: ['irri_cana', 'fator_pos_deficit']
        pesos: [1,1] 
      - name: irri_cana_risco_total
        depends_on: ['irri_cana', 'fator_de_risco_total']
        pesos: [1,1] 
      - name: irri_oc_risco_iminente
        depends_on: ['irri_oc', 'fator_iminente']
        pesos: [1,1] 
      - name: irri_oc_risco_pos_deficit
        depends_on: ['irri_oc', 'fator_pos_deficit']
        pesos: [1,1] 
      - name: irri_oc_risco_total
        depends_on: ['irri_oc', 'fator_de_risco_total']
        pesos: [1,1] 
      - name: irri_total_risco_iminente
        depends_on: []
        pesos: [1,1,1,1,1,1,1] 
      - name: irri_total_risco_pos_deficit
        depends_on: []
        pesos: [1,1,1,1,1,1,1] 
      - name: irri_total_risco_total
        depends_on: []
        pesos: [1,1,1,1,1,1,1] 
      - name: cs_ish_irri
        depends_on: []
        pesos: [1,1,1,1,1,1,1] 
      - name: deman_irri
        depends_on: ['Valor que eu quero ', '/home/luca_profissional/Desktop/BolsaLabgest/ish_lunc/functions_module_ish_eco/input/PAM - ES - demanda.csv']
        pesos: [1,1,1,1,1,1,1] 
      - name: densidade_irri
        depends_on: ['area_otto', 'deman_irri']
        pesos: [1,1] 
      - name: deman_agri_scbc
        depends_on: ['situacao_setor', 'densidade_irri', 'area_setor']
        pesos: [1,1] 
      - name: deman_agri_otto
        depends_on: ['COBACIA', 'deman_agri_scbc']
        pesos: [1] 
      - name: perc_scbc_irri
        depends_on: ['deman_agri_scbc', 'deman_irri']
        pesos: [1,1] 
      - name: irri_risco_scbc
        depends_on: ['perc_scbc_irri', 'irri_total_risco_total']
        pesos: [1,1] 
      - name: cs_ish_scbc_irri
        depends_on: ['cs_ish_irri', 'perc_scbc_irri']
        pesos: [1,1] 
      # - name: irri_scbc
      - name: ire_cs_irri_eco
        depends_on: ['COBACIA', 'cs_ish_scbc_irri']
        pesos: [1] 

  - name: ire_cs_pec_eco
    path: "/home/luca_profissional/Desktop/BolsaLabgest/ish_lunc/functions_module_ish_eco/input/PPM - ES - PPM.csv"
    indicadores:
