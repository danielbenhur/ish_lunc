id: cenario
description: "Cenário teste dados de 2020 - exemplo de uso com joinISH"
base_dir: "."

bho:
  path: "./cnr_A/input/BHO_area.gpkg"
  layer: "bho_area"

dimensions:
  - name: hum
    column: 'ire_cs_hum'
    path: "./functions_module_ish_hum/output/ish_hum.csv"
  - name: eco
    column: 'ire_cs_eco'
    path: "./functions_module_ish_eco/output/ish_eco.csv"
  # - name: ire_cs_amb
    # path: "./functions_module_ish_amb/output/ish_amb.csv"

# Saída: pode opcionalmente sobrescrever pasta output/gpkg final
output:
  folder: "./output"
  gpkg_name: "resultado.gpkg"
  csv_name: "resultado.csv"